name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install dependencies
        run: pip install -r requirements_test.txt

      - name: Run dashboard YAML tests
        run: python -m pytest tests/ -v
